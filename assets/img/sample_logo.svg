<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Badge -->
  <rect x="10" y="10" width="70" height="70" rx="16" fill="url(#primaryGrad)"/>
  
  <!-- Open Book & Signal Waves Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Book Pages -->
    <path d="M 28 58 C 36 54, 45 54, 45 36 C 45 54, 54 54, 62 58 L 62 38 C 54 34, 45 34, 45 24 C 45 34, 36 34, 28 38 Z" fill="#ffffff" fill-opacity="0.12"/>
    <path d="M 45 26 L 45 56"/>
    <!-- Signal Wave Dot -->
    <circle cx="45" cy="20" r="2.5" fill="#3b82f6" stroke="none"/>
    <path d="M 38 18 A 8 8 0 0 1 52 18" stroke="#3b82f6" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <text x="96" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">METRO</text>
  <text x="180" y="44" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="700" fill="#2563eb" letter-spacing="-0.5">POS</text>
  <text x="96" y="62" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.2">COMMUNICATION &amp; BOOKS</text>
</svg>
